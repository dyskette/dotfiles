# Enforce Conventional Commits server-side (local hooks can be skipped with --no-verify).
name: commitlint
on:
  pull_request:
permissions:
  contents: read
jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.js
