# A binary comes from exactly one of OS packages / mise / Mason / dotnet tool (ADR 0001).

[tools]
neovim = "0.12"
tree-sitter = "latest"       # nvim-treesitter (main) compiles parsers with it

node = "lts"
python = "3.13"
uv = "latest"
poetry = "latest"
"npm:basedpyright" = "latest" # Neovim's Python LSP; on node, not a pip venv pinned to one Python (ADR 0011)
go = "latest"
dotnet = { version = "10", os = ["linux", "macos"] }  # Windows: Visual Studio and winget own it, machine-wide
rust = "stable"
java = "temurin-21"

chezmoi = "latest"
github-cli = "latest"
lazygit = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
jq = "latest"
yq = "latest"
pandoc = "latest"            # Office/PDF documents to Markdown and back
eza = "latest"
zoxide = "latest"
delta = "latest"
difftastic = "latest"
"github:gokcehan/lf" = "latest"
ast-grep = "latest"
television = "latest"
atuin = "latest"
starship = { version = "latest", os = ["linux", "macos"] }  # Windows: the PowerShell profile renders its own prompt (ADR 0010)
lefthook = "latest"
gotestsum = "latest"
golangci-lint = "latest"     # nvim-lint's Go linter too; a repo's pin wins (ADR 0001)
"github:joshmedeski/sesh" = "latest"
# psmux (Windows): built from a pinned master commit until a release after 3.4.0 ships the U+FFFD fix (#978,
# 3b6d80b5); then back to winget (marlocarlo.psmux in run_onchange_before_10-packages.ps1). Cargo with MSVC builds it.
"cargo:https://github.com/psmux/psmux" = { version = "rev:7d7dd94ca919b6111774150fbbd18bba325fd0f1", crate = "psmux", os = ["windows"] }
claude = "latest"
copilot = "latest"
"aqua:anomalyco/opencode" = "latest"
terraform = "latest"
azure-cli = "latest"
azure-functions-core-tools = "latest"
aspire = "latest"

[env]
# mise updates claude and copilot, not their self-updaters (opencode: opencode.json).
DISABLE_AUTOUPDATER = "1"
COPILOT_AUTO_UPDATE = "false"

[settings]
# Same roots as sesh.toml and ~/.local/bin/projects.
trusted_config_paths = ["~/Proyectos", "~/Projects", "~/source/repos", "/c/s"]
