# Global mise config: runtimes and CLIs. Repos override in their own mise.toml.
# Ownership rule: a binary comes from exactly one of OS packages / mise / Mason / dotnet tool.
# On work machines, pin exact versions here (or run `mise lock`) for reproducible rollbacks.

[tools]
# Editor
neovim = "0.12"
tree-sitter = "latest"       # nvim-treesitter (main branch) compiles parsers with it

# Runtimes / SDKs
node = "lts"                 # also runs Mason's node-based servers (vtsls, js-debug)
python = "3.13"
uv = "latest"
poetry = "latest"           # vfox backend; needs the python above
go = "latest"
dotnet = "10"                # LTS; sets DOTNET_ROOT for global dotnet tools
rust = "stable"              # per-repo rust-toolchain.toml still wins via rustup

# Dev CLIs
chezmoi = "latest"
github-cli = "latest"
lazygit = "latest"
ripgrep = "latest"
fd = "latest"
fzf = "latest"
bat = "latest"
jq = "latest"
yq = "latest"                # mikefarah/yq (Go), not the python jq wrapper
eza = "latest"
zoxide = "latest"
delta = "latest"
difftastic = "latest"
yazi = "latest"
"github:gokcehan/lf" = "latest"  # folder chooser for tmux prefix+a (sesh-dir); not in the mise registry
ast-grep = "latest"
television = "latest"
atuin = "latest"
starship = "latest"
lefthook = "latest"
gotestsum = "latest"         # neotest-golang runner; repos may pin their own
"github:joshmedeski/sesh" = "latest"   # not in the mise registry

# AI coding CLIs. mise owns the binaries (ADR 0001), so their self-updaters are off in [env];
# update with `mise up`. Pin exact versions on work machines.
claude = "latest"            # Claude Code (registry alias claude-code)
copilot = "latest"           # GitHub Copilot CLI, standalone binary (not the retired `gh copilot` extension)

[env]
DISABLE_AUTOUPDATER = "1"        # Claude Code: no background self-update
COPILOT_AUTO_UPDATE = "false"    # Copilot CLI: no self-update, and no newer cached copy run instead

[settings]
# Auto-trust only your project roots (same list as sesh.toml / ~/.local/bin/projects);
# everything else still needs `mise trust`.
trusted_config_paths = ["~/Proyectos", "~/Projects", "~/source/repos", "/c/s"]
