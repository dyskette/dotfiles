# Merged over tv's defaults. The "default" theme uses ANSI colours, so it follows the terminal.
[ui]
theme = "default"

[ui.input_bar]
position = "top"
prompt = "\uf105 "
border_type = "rounded"

[ui.results_panel]
border_type = "rounded"

[ui.preview_panel]
size = 50
border_type = "rounded"

[ui.theme_overrides]
match_fg = "cyan"

[keybindings]
ctrl-f = "scroll_preview_half_page_down"
ctrl-b = "scroll_preview_half_page_up"
ctrl-d = "select_next_page"
ctrl-u = "select_prev_page"
alt-p = "toggle_preview"

# A list here replaces tv's default list for that channel.
[shell_integration.channel_triggers]
"files" = ["nvim", "vim", "cat", "less", "head", "tail", "nano", "bat", "cp", "mv", "rm", "touch",
  "chmod", "chown", "ln", "tar", "zip", "unzip", "gzip", "gunzip", "xz"]
"git-repos" = ["git clone"]
