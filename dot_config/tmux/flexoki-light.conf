# Flexoki Light — https://stephango.com/flexoki (MIT, © Steph Ango).
# Hex in lower case: tmux reads some upper-case letters after '#' as format flags.

set -g @flexoki_bg   "#fffcf0"
set -g @flexoki_bg2  "#f2f0e5"
set -g @flexoki_ui   "#e6e4d9"
set -g @flexoki_ui2  "#dad8ce"
set -g @flexoki_ui3  "#cecdc3"
set -g @flexoki_tx3  "#b7b5ac"
set -g @flexoki_tx2  "#6f6e69"
set -g @flexoki_tx   "#100f0f"
set -g @flexoki_re   "#af3029"
set -g @flexoki_or   "#bc5215"
set -g @flexoki_ye   "#ad8301"
set -g @flexoki_gr   "#66800b"
set -g @flexoki_cy   "#24837b"
set -g @flexoki_bl   "#205ea6"
set -g @flexoki_pu   "#5e409d"
set -g @flexoki_ma   "#a02f6f"

# Styles aren't expanded as formats before tmux 3.8, so they take literal colors.
set -g status-style                  "bg=#f2f0e5,fg=#6f6e69"
set -g message-style                 "bg=#f2f0e5,fg=#100f0f"
set -g message-command-style         "bg=#f2f0e5,fg=#100f0f"
set -g mode-style                    "bg=#dad8ce,fg=#100f0f"
set -g copy-mode-match-style         "bg=#cecdc3,fg=#100f0f"
set -g copy-mode-current-match-style "bg=#ad8301,fg=#fffcf0"
set -g pane-border-style             "fg=#e6e4d9"
set -g pane-active-border-style      "fg=#24837b"
set -g popup-border-style            "fg=#cecdc3"
set -g display-panes-colour          "#6f6e69"
set -g display-panes-active-colour   "#24837b"
setw -g clock-mode-colour            "#24837b"
