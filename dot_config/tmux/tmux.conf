# ~/.config/tmux/tmux.conf

# --- Terminal capabilities (Neovim :checkhealth clean) ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"   # only needed < tmux 3.6, harmless after
set -as terminal-features ",xterm*:RGB"
set -as terminal-features ",*:usstyle"           # undercurl + colored underlines
set -as terminal-features ",*:hyperlinks"         # pass OSC 8 links through (tmux 3.4+)
set -sg escape-time 10                           # default since 3.5; 500ms before
set -g focus-events on                           # nvim autoread on FocusGained
set -s extended-keys on                          # apps opt in; 'always' can break C-c in shells
set -s extended-keys-format csi-u                # tmux 3.5+
set -as terminal-features "xterm*:extkeys"

# --- Clipboard & passthrough (OSC52 from nvim, also over SSH) ---
set -s set-clipboard on
set -g allow-passthrough on                      # 'on', not 'all'

# --- Ergonomics ---
set -g prefix M-a                                # Alt-a; Alt-a twice sends it to the app
unbind C-b
bind M-a send-prefix
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g detach-on-destroy off                     # killing a session jumps to another one
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# New panes/windows keep the current directory (and therefore the mise env).
# | and - split the pane; \ and _ split the whole window (-f: full height / full width).
bind '"' split-window -v    -c "#{pane_current_path}"
bind %   split-window -h    -c "#{pane_current_path}"
bind |   split-window -h    -c "#{pane_current_path}"
bind -   split-window -v    -c "#{pane_current_path}"
bind '\' split-window -h -f -c "#{pane_current_path}"
bind _   split-window -v -f -c "#{pane_current_path}"
bind c   new-window         -c "#{pane_current_path}"

# --- Copy mode (vi): v/V/C-v select char/line/block, y or a mouse drag copies (OSC 52) ---
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi V   send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# --- Titles: programs set their pane title (nvim its file, Claude Code its task);
# the terminal tab shows "session: title". ---
set -g allow-set-title on
set -g set-titles on
set -g set-titles-string "#S: #{pane_title}"

# Programs that pick features (images, keyboard modes) from TERM/TERM_PROGRAM see the
# attaching client's values, not the ones the server started with. update-environment applies on attach: after changing it, `tmux kill-server`.
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# --- sesh: sessions and projects (prefix + s), prefix + a folder walk, prefix + L last ---
# Replaces tmux's default choose-tree on prefix + s (still reachable with prefix + w for windows).
bind-key s display-popup -E -w 80% -h 70% "tm"   # television's sesh channel (~/.local/bin/tm)
# lf as the folder picker: Enter on a folder opens a session there, q cancels (sesh-dir).
bind-key a display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "sesh-dir"
bind-key L run-shell "sesh last"                 # toggle previous session

# --- lazygit popup in the pane's cwd (prefix + g) ---
bind-key g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# --- Theme: Flexoki, following the terminal's light/dark (docs/adr/0003) ---
# Ghostty reports theme changes (DEC mode 2031); tmux >= 3.6 fires these hooks and forwards
# the change to panes, so Neovim switches too. Terminals that never report stay on dark.
source-file ~/.config/tmux/flexoki-dark.conf
set-hook -g client-light-theme 'source-file ~/.config/tmux/flexoki-light.conf ; refresh-client -S'
set-hook -g client-dark-theme  'source-file ~/.config/tmux/flexoki-dark.conf ; refresh-client -S'
# The theme of a newly attached client may already be known; apply it right away.
set-hook -g client-attached 'if -F "#{==:#{client_theme},light}" "source-file ~/.config/tmux/flexoki-light.conf" "source-file ~/.config/tmux/flexoki-dark.conf"'

# Layout only; colors come from the @flexoki_* options set by the theme files.
set -g status-left-length 40
set -g status-left  "#[fg=#{@flexoki_cy},bold] #S #[default]"
set -g status-right "#{?client_prefix,#[fg=#{@flexoki_ye}#,bold]PREFIX #[default],}#[fg=#{@flexoki_tx2}]%H:%M "
setw -g window-status-format         " #I #W#{?window_zoomed_flag, 󰁌,} "
setw -g window-status-current-format "#[bg=#{@flexoki_ui},fg=#{@flexoki_tx},bold] #I #W#{?window_zoomed_flag, 󰁌,} "
setw -g window-status-activity-style "fg=default,underscore"

# --- Panes and Neovim splits as one layout (smart-splits.nvim, ~/.config/nvim/lua/plugins/navigation.lua) ---
# M-h/j/k/l move, M-H/J/K/L resize (Alt-Shift). In a pane running Neovim the key goes to Neovim,
# which moves through its own splits first and hands the edge back to tmux. Neovim marks its pane
# with @pane-is-vim (smart-splits' tmux backend), so no `ps` runs per keypress.
# Written by hand from the backend's README rather than its TPM plugin, which TPM can't pin.
# select-pane wraps at the edges, matching move.at_edge = 'wrap' on the Neovim side.
bind -n M-h if -F '#{@pane-is-vim}' { send-keys M-h } { select-pane -L }
bind -n M-j if -F '#{@pane-is-vim}' { send-keys M-j } { select-pane -D }
bind -n M-k if -F '#{@pane-is-vim}' { send-keys M-k } { select-pane -U }
bind -n M-l if -F '#{@pane-is-vim}' { send-keys M-l } { select-pane -R }
bind -n M-H if -F '#{@pane-is-vim}' { send-keys M-H } { resize-pane -L 3 }
bind -n M-J if -F '#{@pane-is-vim}' { send-keys M-J } { resize-pane -D 3 }
bind -n M-K if -F '#{@pane-is-vim}' { send-keys M-K } { resize-pane -U 3 }
bind -n M-L if -F '#{@pane-is-vim}' { send-keys M-L } { resize-pane -R 3 }
# The same keys as Ghostty sends them once tmux asks for extended keys (extended-keys on):
# Alt-Shift-l arrives as M-S-l or M-S-L, which a binding on M-L doesn't match. Neovim gets M-L.
bind -n M-S-h if -F '#{@pane-is-vim}' { send-keys M-H } { resize-pane -L 3 }
bind -n M-S-H if -F '#{@pane-is-vim}' { send-keys M-H } { resize-pane -L 3 }
bind -n M-S-j if -F '#{@pane-is-vim}' { send-keys M-J } { resize-pane -D 3 }
bind -n M-S-J if -F '#{@pane-is-vim}' { send-keys M-J } { resize-pane -D 3 }
bind -n M-S-k if -F '#{@pane-is-vim}' { send-keys M-K } { resize-pane -U 3 }
bind -n M-S-K if -F '#{@pane-is-vim}' { send-keys M-K } { resize-pane -U 3 }
bind -n M-S-l if -F '#{@pane-is-vim}' { send-keys M-L } { resize-pane -R 3 }
bind -n M-S-L if -F '#{@pane-is-vim}' { send-keys M-L } { resize-pane -R 3 }
# Copy mode has no Neovim to defer to.
bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
run '~/.config/tmux/plugins/tpm/tpm'
