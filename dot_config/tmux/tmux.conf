# --- Terminal capabilities ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"   # only needed < tmux 3.6
set -as terminal-features ",xterm*:RGB"
set -as terminal-features ",*:usstyle"
set -as terminal-features ",*:hyperlinks"
set -sg escape-time 10
set -g focus-events on
set -s extended-keys on                          # 'always' can break C-c in shells
set -s extended-keys-format csi-u
set -as terminal-features "xterm*:extkeys"

# --- Clipboard (OSC 52) ---
set -s set-clipboard on
set -g allow-passthrough on

# --- Ergonomics ---
set -g prefix M-a
unbind C-b
bind M-a send-prefix
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g detach-on-destroy off
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

bind '"' split-window -v    -c "#{pane_current_path}"
bind %   split-window -h    -c "#{pane_current_path}"
bind |   split-window -h    -c "#{pane_current_path}"
bind -   split-window -v    -c "#{pane_current_path}"
bind '\' split-window -h -f -c "#{pane_current_path}"
bind _   split-window -v -f -c "#{pane_current_path}"
bind c   new-window         -c "#{pane_current_path}"

# --- Copy mode ---
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi V   send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# --- Titles ---
set -g allow-set-title on
set -g set-titles on
set -g set-titles-string "#S: #{pane_title}"

# Applies on attach; after changing it, `tmux kill-server`.
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# --- sesh and lazygit popups ---
bind-key s display-popup -E -w 80% -h 70% "tm"
bind-key a display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "sesh-dir"
bind-key L run-shell "sesh last"
bind-key g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# --- Theme: Flexoki following the terminal's light/dark (ADR 0003, tmux >= 3.6) ---
source-file ~/.config/tmux/flexoki-dark.conf
set-hook -g client-light-theme 'source-file ~/.config/tmux/flexoki-light.conf ; refresh-client -S'
set-hook -g client-dark-theme  'source-file ~/.config/tmux/flexoki-dark.conf ; refresh-client -S'
set-hook -g client-attached 'if -F "#{==:#{client_theme},light}" "source-file ~/.config/tmux/flexoki-light.conf" "source-file ~/.config/tmux/flexoki-dark.conf"'

set -g status-left-length 40
set -g status-left  "#[fg=#{@flexoki_cy},bold] #S #[default]"
set -g status-right "#{?client_prefix,#[fg=#{@flexoki_ye}#,bold]PREFIX #[default],}#[fg=#{@flexoki_tx2}]%H:%M "
setw -g window-status-format         " #I #W#{?window_zoomed_flag, 󰁌,} "
setw -g window-status-current-format "#[bg=#{@flexoki_ui},fg=#{@flexoki_tx},bold] #I #W#{?window_zoomed_flag, 󰁌,} "
setw -g window-status-activity-style "fg=default,underscore"

# --- Panes and Neovim splits as one layout (smart-splits.nvim, ADR 0004) ---
# Neovim sets @pane-is-vim on its pane. Hand-written instead of the backend's TPM plugin,
# which TPM can't pin.
bind -n M-h if -F '#{@pane-is-vim}' { send-keys M-h } { select-pane -L }
bind -n M-j if -F '#{@pane-is-vim}' { send-keys M-j } { select-pane -D }
bind -n M-k if -F '#{@pane-is-vim}' { send-keys M-k } { select-pane -U }
bind -n M-l if -F '#{@pane-is-vim}' { send-keys M-l } { select-pane -R }
bind -n M-H if -F '#{@pane-is-vim}' { send-keys M-H } { resize-pane -L 3 }
bind -n M-J if -F '#{@pane-is-vim}' { send-keys M-J } { resize-pane -D 3 }
bind -n M-K if -F '#{@pane-is-vim}' { send-keys M-K } { resize-pane -U 3 }
bind -n M-L if -F '#{@pane-is-vim}' { send-keys M-L } { resize-pane -R 3 }
# With extended keys, Alt-Shift-l arrives as M-S-l or M-S-L, which M-L doesn't match.
bind -n M-S-h if -F '#{@pane-is-vim}' { send-keys M-H } { resize-pane -L 3 }
bind -n M-S-H if -F '#{@pane-is-vim}' { send-keys M-H } { resize-pane -L 3 }
bind -n M-S-j if -F '#{@pane-is-vim}' { send-keys M-J } { resize-pane -D 3 }
bind -n M-S-J if -F '#{@pane-is-vim}' { send-keys M-J } { resize-pane -D 3 }
bind -n M-S-k if -F '#{@pane-is-vim}' { send-keys M-K } { resize-pane -U 3 }
bind -n M-S-K if -F '#{@pane-is-vim}' { send-keys M-K } { resize-pane -U 3 }
bind -n M-S-l if -F '#{@pane-is-vim}' { send-keys M-L } { resize-pane -R 3 }
bind -n M-S-L if -F '#{@pane-is-vim}' { send-keys M-L } { resize-pane -R 3 }
bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
run '~/.config/tmux/plugins/tpm/tpm'
