# Flexoki Dark for tmux — https://stephango.com/flexoki (MIT, © Steph Ango).
# Sourced by tmux.conf on start and on the client-dark-theme hook. Dark themes use the 400 accents.
# Hex in lower case: tmux reads some upper-case letters after '#' as format flags.

# Palette (user options, read by the formats in tmux.conf)
set -g @flexoki_bg   "#100f0f"
set -g @flexoki_bg2  "#1c1b1a"
set -g @flexoki_ui   "#282726"
set -g @flexoki_ui2  "#343331"
set -g @flexoki_ui3  "#403e3c"
set -g @flexoki_tx3  "#575653"
set -g @flexoki_tx2  "#878580"
set -g @flexoki_tx   "#cecdc3"
set -g @flexoki_re   "#d14d41"
set -g @flexoki_or   "#da702c"
set -g @flexoki_ye   "#d0a215"
set -g @flexoki_gr   "#879a39"
set -g @flexoki_cy   "#3aa99f"
set -g @flexoki_bl   "#4385be"
set -g @flexoki_pu   "#8b7ec8"
set -g @flexoki_ma   "#ce5d97"

# Styles are not expanded as formats before tmux 3.8, so they take literal colors.
set -g status-style                  "bg=#1c1b1a,fg=#878580"
set -g message-style                 "bg=#1c1b1a,fg=#cecdc3"
set -g message-command-style         "bg=#1c1b1a,fg=#cecdc3"
set -g mode-style                    "bg=#343331,fg=#cecdc3"
set -g copy-mode-match-style         "bg=#403e3c,fg=#cecdc3"
set -g copy-mode-current-match-style "bg=#d0a215,fg=#100f0f"
set -g pane-border-style             "fg=#282726"
set -g pane-active-border-style      "fg=#3aa99f"
set -g popup-border-style            "fg=#403e3c"
set -g display-panes-colour          "#878580"
set -g display-panes-active-colour   "#3aa99f"
setw -g clock-mode-colour            "#3aa99f"
