# Shared by tmux (tmux.conf) and psmux on Windows (~/.psmux.conf): only what both support.
set -g prefix M-a
unbind C-b
bind M-a send-prefix
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -s set-clipboard on
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string "#S: #{pane_title}"

bind '"' split-window -v    -c "#{pane_current_path}"
bind %   split-window -h    -c "#{pane_current_path}"
bind |   split-window -h    -c "#{pane_current_path}"
bind -   split-window -v    -c "#{pane_current_path}"
bind '\' split-window -h -f -c "#{pane_current_path}"
bind _   split-window -v -f -c "#{pane_current_path}"
bind c   new-window         -c "#{pane_current_path}"

bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi V   send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel

bind-key s display-popup -E -w 80% -h 70% "tm"
bind-key a display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "sesh-dir"
bind-key L run-shell "sesh last"
bind-key g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# Panes and Neovim splits as one layout (smart-splits.nvim, ADR 0004); Neovim sets @pane-is-vim.
bind -n M-h if -F '#{@pane-is-vim}' 'send-keys M-h' 'select-pane -L'
bind -n M-j if -F '#{@pane-is-vim}' 'send-keys M-j' 'select-pane -D'
bind -n M-k if -F '#{@pane-is-vim}' 'send-keys M-k' 'select-pane -U'
bind -n M-l if -F '#{@pane-is-vim}' 'send-keys M-l' 'select-pane -R'
# Alt-Shift resizes. Bound as M-S-h, not M-H: psmux 3.4 reads a bound M-H as M-h, which would replace the
# moves above, while its send-keys reads M-H right (and M-S-h as Alt-Shift-S). tmux.conf adds M-H for tmux.
bind -n M-S-h if -F '#{@pane-is-vim}' 'send-keys M-H' 'resize-pane -L 3'
bind -n M-S-j if -F '#{@pane-is-vim}' 'send-keys M-J' 'resize-pane -D 3'
bind -n M-S-k if -F '#{@pane-is-vim}' 'send-keys M-K' 'resize-pane -U 3'
bind -n M-S-l if -F '#{@pane-is-vim}' 'send-keys M-L' 'resize-pane -R 3'
bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R
