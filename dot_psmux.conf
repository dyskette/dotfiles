# psmux (tmux for Windows) reads this before ~/.tmux.conf.
source-file ~/.config/tmux/common.conf
bind r source-file ~/.psmux.conf \; display "reloaded"

# Noctty is Ghostty's terminal. With psmux's default xterm-256color, Neovim draws undercurls (diagnostics,
# spelling) as plain underlines; xterm-ghostty is in its built-in terminfo, with styled underlines, and
# keeps Neovim's Windows cursor fix for xterm types (unlike tmux-256color, psmux#806). New panes only.
set -g default-terminal "xterm-ghostty"

# Flexoki Dark: psmux has no light/dark theme hooks.
set -g status-left-length 40
set -g status-style "bg=#1c1b1a,fg=#878580"
set -g status-left  "#[fg=#3aa99f,bold] #S #[default]"
set -g status-right "#{?client_prefix,#[fg=#d0a215#,bold]PREFIX #[default],}#[fg=#878580]%H:%M "
setw -g window-status-current-format "#[bg=#282726,fg=#cecdc3,bold] #I #W "
