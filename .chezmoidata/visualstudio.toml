# Visual Studio Enterprise 2026 components, installed by run_onchange_after_47-visualstudio.ps1.tmpl.
# MSVC lives here too (ADR 0009): a separate Build Tools install is a second, newer MSBuild without the
# .NET SDK resolver, and nuget.exe and vswhere -latest scripts pick it and skip SDK-style projects.
[visualstudio]
components = [
  "Microsoft.VisualStudio.Workload.CoreEditor",
  "Microsoft.VisualStudio.Workload.NetWeb",     # ASP.NET, Blazor, Razor
  "Microsoft.VisualStudio.Workload.Azure",      # Functions, App Service, Storage
  "Microsoft.Net.Component.4.8.TargetingPack",  # .NET Framework projects
  "Microsoft.Net.Component.4.8.SDK",
  "Microsoft.NetCore.Component.Runtime.10.0",
  "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",   # MSVC: rust's linker, tree-sitter's C compiler
  "Microsoft.VisualStudio.Component.Windows11SDK.26100",  # Windows libraries the linker needs
]

# VSIX URLs, installed by run_onchange_after_95-visualstudio-extensions.ps1.tmpl.
# Marketplace extensions: "latest", then Visual Studio updates them itself.
# GitHub releases: pinned to a tag, so changing the URL here is what updates them.
extensions = [
  "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/JaredParMSFT/vsextensions/VsVim2022Preview/latest/vspackage",  # VsVim 2026
  "https://github.com/dyskette/vs-nerdx/releases/download/v1.0.3/VsNerdX.vsix",
  "https://github.com/dyskette/vs-flexoki/releases/download/v1.0.0/Flexoki.vsix",
]
